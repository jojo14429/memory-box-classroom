<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小明與伯伯・回憶機關盒</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #f5eedc; color: #493b2e; font-family: system-ui, sans-serif; }
    body { overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #canvas:focus { outline: none; }
    #start-panel { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: #f5eedc; overflow: auto; }
    .card { width: min(900px, 100%); padding: clamp(24px, 4vw, 60px); border: 2px solid #ad9670; border-radius: 24px; background: #fff9ed; text-align: center; }
    h1 { font-size: clamp(30px, 3vw, 52px); margin: 0 0 24px; }
    p, a { font-size: clamp(20px, 1.8vw, 28px); line-height: 1.6; }
    button { padding: 20px 32px; min-height: 72px; margin: 10px; border: 2px solid #648151; border-radius: 16px; color: #26331e; background: #dce7c4; font: inherit; font-size: clamp(24px, 2.2vw, 36px); cursor: pointer; }
    button:focus-visible { outline: 4px solid #ac5c35; }
    button:disabled { cursor: progress; opacity: .65; }
    #status { white-space: pre-wrap; }
    progress { width: 80%; min-height: 24px; }
    a { color: #64402b; }
    #fullscreen-prompt { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: #493b2e99; }
    #fullscreen-prompt[hidden] { display: none; }
  </style>
  
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="回憶機關盒遊戲畫面">瀏覽器不支援 Canvas，請改用最新 Chrome 或 Edge。</canvas>
  <section id="start-panel" aria-label="開始遊戲">
    <div class="card">
      <h1>小明與伯伯・回憶機關盒</h1>
      <p>課室觸碰大螢幕版<br>先完成現場活動，再確認取得拼圖。</p>
      <button id="start-button">開始遊戲</button>
      <button id="fullscreen-button">全螢幕</button>
      <p id="status" role="status" aria-live="polite">首次載入需要下載遊戲資源，請保持網絡連線。</p>
      <progress id="progress" hidden></progress>
      <p>進度只保存在這個瀏覽器，與 EXE 不共用。<br>清除網站資料、無痕模式或換電腦可能失去進度。</p>
      <a href="LICENSES.txt" target="_blank" rel="noopener">授權告知</a>
    </div>
  </section>
  <section id="fullscreen-prompt" role="dialog" aria-modal="true" aria-label="全螢幕確認" hidden>
    <div class="card">
      <p>瀏覽器需要直接確認。請再按一下進入全螢幕。</p>
      <button id="fullscreen-confirm">進入全螢幕</button>
      <button id="fullscreen-cancel">取消</button>
      <p id="fullscreen-status" role="status" aria-live="polite"></p>
    </div>
  </section>
  <noscript>請啟用 JavaScript，或使用 Windows EXE 後備版。</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5156944,"index.wasm":43682606},"focusCanvas":true,"gdextensionLibs":[]};
    const threadsEnabled = false;
    const engine = new Engine(config);
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const startButton = document.getElementById('start-button');
    const fullscreenPrompt = document.getElementById('fullscreen-prompt');
    const fullscreenStatus = document.getElementById('fullscreen-status');
    function closeFullscreenPrompt() {
      fullscreenPrompt.hidden = true;
      canvas.focus();
    }
    window.memoryBoxToggleFullscreen = function (event) {
      // Canvas input reaches Godot on a later frame. Ask for a native gesture
      // before attempting fullscreen, rather than triggering a rejected request.
      if (window.memoryBoxStarted && !document.fullscreenElement && !(event && event.isTrusted)) {
        fullscreenPrompt.hidden = false;
        fullscreenStatus.textContent = '';
        document.getElementById('fullscreen-confirm').focus();
        return;
      }
      const action = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      // Godot may process canvas input on a later frame, outside the browser gesture.
      // A native HTML confirmation supplies a new, direct user gesture if needed.
      if (action && action.catch) action.catch(() => {
        fullscreenPrompt.hidden = false;
        fullscreenStatus.textContent = '若仍未允許，可用瀏覽器選單或 F11；取消不會影響進度。';
        document.getElementById('fullscreen-confirm').focus();
      });
    };
    document.getElementById('fullscreen-confirm').addEventListener('click', window.memoryBoxToggleFullscreen);
    document.getElementById('fullscreen-cancel').addEventListener('click', closeFullscreenPrompt);
    document.addEventListener('fullscreenchange', closeFullscreenPrompt);
    fullscreenPrompt.addEventListener('keydown', event => {
      if (event.key === 'Escape') { closeFullscreenPrompt(); event.preventDefault(); }
      if (event.key === 'Tab') {
        const confirm = document.getElementById('fullscreen-confirm');
        const cancel = document.getElementById('fullscreen-cancel');
        (document.activeElement === confirm ? cancel : confirm).focus();
        event.preventDefault();
      }
    });
    document.getElementById('fullscreen-button').addEventListener('click', window.memoryBoxToggleFullscreen);
    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      const missing = Engine.getMissingFeatures({threads: threadsEnabled});
      if (missing.length) {
        status.textContent = '瀏覽器缺少所需功能：' + missing.join('、') + '\n請使用最新 Chrome／Edge，或 Windows EXE。';
        startButton.disabled = false;
        return;
      }
      const args = [];
      // QA is explicit, uses only an isolated test save, and never resets normal play.
      const query = new URLSearchParams(location.search);
      const run = query.get('qa_run');
      if (query.get('qa') === '1' && run && /^[a-z0-9_-]{1,48}$/i.test(run)) {
        args.push('--', '--verify-build', '--verify-run=' + run);
        if (query.get('resume') === '1') args.push('--verify-resume');
      }
      progress.hidden = false;
      status.textContent = '正在載入，請稍候…';
      try {
        await engine.startGame({args, canvas, onProgress(current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
        }});
        document.getElementById('start-panel').remove();
        canvas.focus();
        window.memoryBoxStarted = true;
      } catch (error) {
        console.error(error);
        status.textContent = '載入失敗：' + String(error.message || error) + '\n請重新整理，或使用 Windows EXE。';
        progress.hidden = true;
      }
    });
  </script>
</body>
</html>
